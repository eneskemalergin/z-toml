name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Zig ${{ matrix.zig }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 0.16.0 is the default toolchain; 0.17.0 is also supported.
        zig: ["0.16.0", "0.17.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig ${{ matrix.zig }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Run tests
        run: zig build test --summary all

      - name: Build example
        run: zig build example

      - name: Build proteomics example
        run: zig build proteomics
